name: Assign

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions: {}

jobs:
  assign:
    name: Assign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Assign the pull request to its author
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: toshimaru/auto-author-assign@3e19bfc990cb1cf0589dce95e9f75289bb1e22de # v3.0.3

      - name: Assign the issue to the maintainer
        if: ${{ github.event_name == 'issues' }}
        uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
        with:
          assignees: ${{ github.repository_owner }}
