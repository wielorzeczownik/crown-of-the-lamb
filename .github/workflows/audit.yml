name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --features=fix

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: portal/package.json
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Run audit
        id: audit
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash scripts/security-audit.sh

      - name: Commit fixed Cargo.lock
        if: ${{ steps.audit.outputs.cargo_changed == 'true' }}
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: 'Cargo.lock'
          default_author: github_actions
          message: 'fix(deps): resolve audit advisories'
          push: true

      - name: Commit portal fix (runtime advisory)
        if: ${{ steps.audit.outputs.npm_changed == 'true' && steps.audit.outputs.npm_production == 'true' }}
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: 'portal/package-lock.json'
          default_author: github_actions
          message: 'fix(deps): resolve audit advisories'
          push: true

      - name: Commit portal fix (dev-only advisory)
        if: ${{ steps.audit.outputs.npm_changed == 'true' && steps.audit.outputs.npm_production == 'false' }}
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: 'portal/package-lock.json'
          default_author: github_actions
          message: 'build(deps): resolve audit advisories'
          push: true

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          filename: .github/security-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          labels: security-advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: 'Neither `cargo audit` nor `npm audit` reports advisories any more.'
