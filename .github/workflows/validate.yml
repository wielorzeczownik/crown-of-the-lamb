name: Validate

on: pull_request

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=crate depName=espup
  ESPUP_VERSION: 0.18.0
  # renovate: datasource=npm depName=prettier
  PRETTIER_VERSION: 3.9.10

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            portal: &portal
              - '.github/workflows/validate.yml'
              - 'portal/**'
            rust:
              - *portal
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.clippy.toml'
              - '.cargo/config.toml'
              - 'partitions.csv'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.ts'
              - '**/*.html'
              - '**/*.css'

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: ${{ env.ACTIONLINT_VERSION }}
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  clippy:
    name: Clippy
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install espup
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: espup@${{ env.ESPUP_VERSION }}

      - name: Install Xtensa toolchain
        run: espup install --targets esp32
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Source Xtensa environment
        run: |
          source "$HOME/export-esp.sh"
          echo "PATH=$PATH" >>"$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >>"$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: portal/package.json
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (firmware)
        run: cargo clippy --locked -- -D warnings

  tests:
    name: Tests
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HOST_TARGET: x86_64-unknown-linux-gnu
      RUSTFLAGS: ''
      CARGO_UNSTABLE_BUILD_STD: 'std,alloc,core,panic_unwind,proc_macro'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install espup
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: espup@${{ env.ESPUP_VERSION }}

      - name: Install Xtensa toolchain
        run: espup install --targets esp32
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Source Xtensa environment
        run: |
          source "$HOME/export-esp.sh"
          echo "PATH=$PATH" >>"$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >>"$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: host-test

      - name: Clippy (library and test code)
        run: cargo clippy --lib --tests --locked --target "$HOST_TARGET" -- -D warnings

      - name: Cargo test
        run: cargo test --lib --locked --target "$HOST_TARGET"

  firmware:
    name: Firmware
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install espup
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: espup@${{ env.ESPUP_VERSION }}

      - name: Install Xtensa toolchain
        run: espup install --targets esp32
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Source Xtensa environment
        run: |
          source "$HOME/export-esp.sh"
          echo "PATH=$PATH" >>"$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >>"$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: portal/package.json
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build firmware
        run: cargo build --release --locked

  portal:
    name: Portal
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.portal == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: portal/package.json
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
