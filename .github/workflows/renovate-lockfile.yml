name: Renovate lockfile

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'Cargo.toml'

permissions: {}

concurrency:
  group: renovate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfile:
    name: Sync Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Check whether Cargo.lock already matches Cargo.toml
        id: check
        shell: bash
        run: |
          set -uo pipefail
          if cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            echo 'in_sync=true' >>"$GITHUB_OUTPUT"
            echo 'Cargo.lock already satisfies Cargo.toml, nothing to do.'
          else
            echo 'in_sync=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Reconcile Cargo.lock
        if: ${{ steps.check.outputs.in_sync == 'false' }}
        run: cargo metadata --format-version 1 >/dev/null

      - name: Show what changed
        if: ${{ steps.check.outputs.in_sync == 'false' }}
        run: git --no-pager diff --stat -- Cargo.lock

      - name: Stage Cargo.lock
        if: ${{ steps.check.outputs.in_sync == 'false' }}
        run: git add Cargo.lock

      - name: Commit Cargo.lock (verified)
        if: ${{ steps.check.outputs.in_sync == 'false' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'chore(deps): sync Cargo.lock with the updated manifest'
          skip-empty: true

      - name: Push Cargo.lock
        if: ${{ steps.check.outputs.in_sync == 'false' }}
        run: git push
