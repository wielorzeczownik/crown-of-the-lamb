name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "portal/**"
      - "build.rs"
      - "partitions.csv"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: release-main
  cancel-in-progress: true

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit_changes: ${{ steps.bump.outputs.commit_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Determine next version (git-cliff)
        id: cliff_bumped
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: bumped-version.txt
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump project version
        id: bump
        shell: bash
        env:
          CLIFF_BUMPED_VERSION: ${{ steps.cliff_bumped.outputs.content }}
        run: bash scripts/bump-version.sh

      - name: Generate release notes (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff-release.toml
          args: --unreleased --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate CHANGELOG.md (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit, tag, and push
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'true' }}
        uses: EndBug/add-and-commit@v10.0.0
        with:
          add: "Cargo.toml Cargo.lock CHANGELOG.md"
          default_author: github_actions
          message: "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          tag: "${{ steps.bump.outputs.tag }}"
          push: true

      - name: Commit changelog and tag
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'false' }}
        uses: EndBug/add-and-commit@v10.0.0
        with:
          add: "CHANGELOG.md"
          default_author: github_actions
          message: "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          tag: "${{ steps.bump.outputs.tag }}"
          push: true

      - name: Upload release notes
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  build-firmware:
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Install host Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install espup
        uses: taiki-e/install-action@v2.82.6
        with:
          tool: espup

      - name: Install Xtensa toolchain
        run: espup install --targets esp32

      - name: Source Xtensa environment
        run: |
          source "$HOME/export-esp.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

      - name: Install espflash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install espflash

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build firmware
        run: cargo build --release

      - name: Build firmware image (bootloader + partitions + app)
        run: |
          espflash save-image \
            --merge \
            --chip esp32 \
            --partition-table partitions.csv \
            target/xtensa-esp32-none-elf/release/crown-of-the-lamb \
            crown-of-the-lamb.bin

      - name: Compute SHA-256 checksum
        run: |
          sha256sum crown-of-the-lamb.bin > crown-of-the-lamb.bin.sha256

      - name: Attest firmware
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: crown-of-the-lamb.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware
          path: |
            crown-of-the-lamb.bin
            crown-of-the-lamb.bin.sha256

  publish-release:
    needs:
      - prepare-release
      - build-firmware
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: firmware
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
